name: CI build

# Self-contained build for the Suwayomi-Aniyomi-WebUI fork: publishes a prerelease
# IN THIS REPO via the default GITHUB_TOKEN. No external preview/GH-Pages repos and
# no BUILD_PREVIEW_TOKEN/DEPLOY_PREVIEW_TOKEN secrets required.

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build artifacts and publish prerelease
    if: "!startsWith(github.event.head_commit.message, '[SKIP CI]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the revision/tag is correct

      - name: Set up NodeJs
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - uses: pnpm/action-setup@v4.2.0
        name: Install pnpm
        with:
          version: 11.1.2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Build webUI
        run: |
          pnpm ci
          pnpm build
          pnpm build-zip
          pnpm build-md5
          ls buildZip

      - name: Generate Tag Name
        id: GenTagName
        run: |
          genTag="r$(git rev-list HEAD --count)"
          echo "$genTag"
          echo "value=$genTag" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.GenTagName.outputs.value }}
          name: ${{ steps.GenTagName.outputs.value }}
          prerelease: true
          generate_release_notes: true
          files: buildZip/*
