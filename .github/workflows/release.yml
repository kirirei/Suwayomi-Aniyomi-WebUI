name: Release

# Self-contained stable release: publishes a draft release IN THIS REPO via the
# default GITHUB_TOKEN. No external "Suwayomi-WebUI" release target/owner assumed.

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create changelog, build artifacts and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up NodeJs
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'

      - uses: pnpm/action-setup@v4.2.0
        name: Install pnpm
        with:
          version: 11.1.2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Generate Tag Name
        id: GenTagName
        run: |
          genTag="v${{ github.event.inputs.release_version }}"
          echo "value=$genTag" >> "$GITHUB_OUTPUT"

      - name: Build webUI
        run: |
          pnpm ci
          pnpm build
          pnpm build-zip
          pnpm build-md5

      - name: Rename artifact
        run: |
          cd buildZip
          for file in *.zip; do
            mv "$file" "${file%-r$(git rev-list HEAD --count).zip}-${{ steps.GenTagName.outputs.value }}.zip"
          done

      - name: Create Tag
        run: |
          TAG="${{ steps.GenTagName.outputs.value }}"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git tag $TAG
          git push origin $TAG

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.GenTagName.outputs.value }}
          name: ${{ steps.GenTagName.outputs.value }}
          draft: true
          files: buildZip/*
